<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Video Player (.html) &amp; Production Script: Autonomous Task Notification Webhook - Video Production Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #050b14;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    .container {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .badge {
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid #06b6d4;
      color: #22d3ee;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .title { font-size: 20px; font-weight: 800; color: #ffffff; }
    .subtitle { font-size: 13px; color: #94a3b8; }
    .video-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #334155;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn:hover { background: #0369a1; }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .btn-secondary:hover { background: #334155; color: #ffffff; }
    .btn-export {
      background: #059669;
    }
    .btn-export:hover { background: #047857; }
    .progress-bar-container {
      flex: 1;
      height: 6px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #06b6d4, #10b981);
      width: 0%;
      transition: width 0.1s linear;
    }
    .time-display {
      font-family: monospace;
      font-size: 12px;
      color: #94a3b8;
      min-width: 80px;
    }
    .storyboard-panel {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .storyboard-title {
      font-size: 14px;
      font-weight: 700;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .scenes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
    }
    .scene-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .scene-card:hover, .scene-card.active {
      border-color: #06b6d4;
      background: #082f49;
    }
    .scene-card-header {
      font-weight: 700;
      color: #22d3ee;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <span class="badge">🎬 Interactive Video Production</span>
        <h1 class="title">Interactive Video Player (.html) &amp; Production Script: Autonomous Task Notification Webhook</h1>
        <p class="subtitle">Mission: Feature Scaffold Mission 1789053598236 // Video ID: eH6eCJRCtcEWCua8GHBq</p>
      </div>
      <div>
        <button id="exportBtn" class="btn btn-export">
          <span>📹 Export WebM Video</span>
        </button>
      </div>
    </div>

    <!-- Video Canvas Viewport -->
    <div class="video-viewport">
      <canvas id="videoCanvas" width="1280" height="720"></canvas>
    </div>

    <!-- Controls Bar -->
    <div class="controls">
      <button id="playBtn" class="btn">▶ Play</button>
      <button id="restartBtn" class="btn btn-secondary">↺ Restart</button>
      <div class="progress-bar-container" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-display" id="timeDisplay">0:00 / 0:24</div>
      <button id="muteBtn" class="btn btn-secondary">🔊 Sound</button>
    </div>

    <!-- Storyboard Breakdown -->
    <div class="storyboard-panel">
      <div class="storyboard-title">
        <span>📋 Scene Breakdown &amp; Cinematography Timeline</span>
      </div>
      <div class="scenes-grid" id="scenesList"></div>
    </div>
  </div>

  <script>
    const scenes = [{"title":"Video Production Script & Storyboard","duration":5,"visual":"Here is the complete, production-ready Video Production Script & Storyboard for Feature Scaffold Mission 1789053598236.. Mission Title: Feature Scaffold Mission 1789053598236. Topic: Autonomous Task Notification Webhook. Production Role: Video Producer & Cinematography Director (Neptena-OS)","audio":"Now reviewing Video Production Script & Storyboard. Here is the complete, production-ready Video Production Script & Storyboard for Feature Scaffold Mission 1789053598236.","bgGradient":"rgba(6, 182, 212, 0.3)"},{"title":"1. Video Overview","duration":5.5,"visual":"Video Title: *Neptena-OS Feature Scaffold: Autonomous Task Notification Webhook*. Target Runtime: 75 Seconds (01:15). Target Audience: Software Engineers, DevOps Engineers, System Architects, Open Source Contributors, Engineering Managers.. Mood & Pacing: High-tech, precise, sleek, energetic. Fast-paced cuts paired with smooth kinetic camera movements, dark-mode UI visualizations, and neon blue/purple code accents.. Aspect Ratio: 16:9 Primary (4K Master) with 9:16 safe region framing for social vertical re-cuts.","audio":"Now reviewing 1. Video Overview. Video Title: *Neptena-OS Feature Scaffold: Autonomous Task Notification Webhook*","bgGradient":"rgba(16, 185, 129, 0.3)"},{"title":"Scene 1 [0:00 - 0:10] — Mission Initialization & PRD Ingestion","duration":6,"visual":"Visual Framing & Camera Direction:. *Shot Type*: Slow push-in on dark-mode Neptena-OS Mission Control interface.. *Movement*: Camera glides through a 3D glass plane as glowing cyan text ingests raw markdown from the PRD.. Audio & Sound Effects:. *BGM*: Low atmospheric synth pad building into a rhythmic, driving electronic beat.. *SFX*: Futuristic cybernetic UI scan chime, ambient hum.. Voiceover / Narration Script:. On-Screen Text & Graphics:. Top Badge: `MISSION 1789053598236 // ACTIVE`. Sub-overlay: `PRD SPECIFICATION INGESTED`. Text Highlight: `Topic: Autonomous Task Notification Webhook`","audio":"Now reviewing Scene 1 [0:00 - 0:10] — Mission Initialization & PRD Ingestion. Visual Framing & Camera Direction:","bgGradient":"rgba(6, 182, 212, 0.3)"},{"title":"Scene 2 [0:10 - 0:22] — Automated Branching & Git Workflow","duration":6.5,"visual":"Visual Framing & Camera Direction:. *Shot Type*: Macro view of a glowing terminal terminal line, transitioning into a dynamic Git node graph.. *Movement*: Camera tilts along a neon branch split extending from the `main` branch into a new feature lineage.. Audio & Sound Effects:. *BGM*: Mid-tempo synth bass line engages.. *SFX*: Rapid mechanical keyboard keystrokes, energetic digital slide sound.. Voiceover / Narration Script:. On-Screen Text & Graphics:. Animated Terminal Prompt: `$ git checkout -b feature/webhook-notification-dispatcher`. Callout Badge: `GITHUB FEATURE BRANCH CREATED`","audio":"Now reviewing Scene 2 [0:10 - 0:22] — Automated Branching & Git Workflow. Visual Framing & Camera Direction:","bgGradient":"rgba(16, 185, 129, 0.3)"},{"title":"Scene 3 [0:22 - 0:38] — Scaffolded TypeScript Core (`WebhookNotificationDispatcher`)","duration":7,"visual":"Visual Framing & Camera Direction:. *Shot Type*: Isometric 3D code workspace fly-through inside VS Code / IDE context.. *Movement*: Camera tracks down line-by-line as typed interfaces and class skeletons render dynamically.. Audio & Sound Effects:. *BGM*: Upbeat techno-synth arpeggio.. *SFX*: Soft metallic pings on each highlighted method signature.. Voiceover / Narration Script:. On-Screen Text & Graphics:. Split Panels highlighting code snippets:. `interface WebhookConfig { endpoint; retryCount; secretHmacKey; }`. `initialize()` | `execute(params)` | `verifySignature()`. Visual Tag: `TYPESCRIPT 5.x // STRICT TYPING`","audio":"Now reviewing Scene 3 [0:22 - 0:38] — Scaffolded TypeScript Core (`WebhookNotificationDispatcher`). Visual Framing & Camera Direction:","bgGradient":"rgba(6, 182, 212, 0.3)"}];
    const canvas = document.getElementById('videoCanvas');
    const ctx = canvas.getContext('2d');
    const playBtn = document.getElementById('playBtn');
    const restartBtn = document.getElementById('restartBtn');
    const progressFill = document.getElementById('progressFill');
    const timeDisplay = document.getElementById('timeDisplay');
    const progressBar = document.getElementById('progressBar');
    const muteBtn = document.getElementById('muteBtn');
    const exportBtn = document.getElementById('exportBtn');
    const scenesList = document.getElementById('scenesList');

    let isPlaying = false;
    let currentTime = 0;
    let totalDuration = scenes.reduce((acc, s) => acc + s.duration, 0);
    let soundEnabled = true;
    let audioCtx = null;
    let animationFrame = null;
    let lastTimestamp = null;
    let mediaRecorder = null;
    let recordedChunks = [];

    // Render Scene List
    scenes.forEach((scene, i) => {
      const card = document.createElement('div');
      card.className = 'scene-card' + (i === 0 ? ' active' : '');
      card.id = 'scene-card-' + i;
      card.innerHTML = `
        <div class="scene-card-header">Scene ${i + 1}: ${scene.title}</div>
        <div style="color: #cbd5e1; margin-bottom: 4px;">${scene.visual.slice(0, 60)}...</div>
        <div style="color: #64748b; font-size: 11px;">Duration: ${scene.duration}s</div>
      `;
      card.onclick = () => seekToScene(i);
      scenesList.appendChild(card);
    });

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playTone(freq, type = 'sine', duration = 0.2) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function getCurrentScene(time) {
      let accumulated = 0;
      for (let i = 0; i < scenes.length; i++) {
        accumulated += scenes[i].duration;
        if (time <= accumulated || i === scenes.length - 1) {
          const sceneStart = accumulated - scenes[i].duration;
          const sceneProgress = Math.min(1, Math.max(0, (time - sceneStart) / scenes[i].duration));
          return { index: i, scene: scenes[i], progress: sceneProgress };
        }
      }
      return { index: 0, scene: scenes[0], progress: 0 };
    }

    function renderFrame() {
      const { index, scene, progress } = getCurrentScene(currentTime);

      // Update active scene card
      document.querySelectorAll('.scene-card').forEach((c, idx) => {
        c.classList.toggle('active', idx === index);
      });

      // Clear Canvas
      ctx.fillStyle = '#050b14';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Animated Tech Grid
      ctx.strokeStyle = 'rgba(30, 41, 59, 0.4)';
      ctx.lineWidth = 1;
      const gridSize = 40;
      for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Animated Ambient Background Blobs
      const pulse = Math.sin(currentTime * 2) * 20;
      const gradient = ctx.createRadialGradient(
        canvas.width / 2 + Math.cos(currentTime) * 100,
        canvas.height / 2 + Math.sin(currentTime) * 50,
        50,
        canvas.width / 2,
        canvas.height / 2,
        400 + pulse
      );
      gradient.addColorStop(0, scene.bgGradient || 'rgba(6, 182, 212, 0.25)');
      gradient.addColorStop(1, 'rgba(5, 11, 20, 0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Scene Header Badge
      ctx.fillStyle = '#082f49';
      ctx.strokeStyle = '#06b6d4';
      ctx.lineWidth = 2;
      roundRect(ctx, 80, 60, 240, 36, 18, true, true);

      ctx.fillStyle = '#22d3ee';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText(`SCENE ${index + 1} // ${(scene.duration - (progress * scene.duration)).toFixed(1)}s`, 100, 83);

      // Scene Title (Kinetic Fade & Slide)
      const slideY = 160 + (1 - Math.min(1, progress * 4)) * -20;
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 38px sans-serif';
      ctx.fillText(scene.title, 80, slideY);

      // Visual Scene Card Box
      ctx.fillStyle = '#0f172a';
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2;
      roundRect(ctx, 80, 210, 1120, 320, 16, true, true);

      // Visual Content Graphic within Box
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 22px sans-serif';
      ctx.fillText('Visual Directives:', 120, 260);

      ctx.fillStyle = '#cbd5e1';
      ctx.font = '18px sans-serif';
      wrapText(ctx, scene.visual, 120, 300, 1040, 28);

      // Voiceover / Audio Script Subtitle Box
      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
      ctx.strokeStyle = '#0284c7';
      roundRect(ctx, 80, 560, 1120, 100, 12, true, true);

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 14px monospace';
      ctx.fillText('VOICEOVER / NARRATION:', 110, 590);

      ctx.fillStyle = '#f8fafc';
      ctx.font = 'italic 18px sans-serif';
      wrapText(ctx, '"' + scene.audio + '"', 110, 625, 1060, 24);

      // Animated Watermark & Progress at bottom
      ctx.fillStyle = 'rgba(148, 163, 184, 0.6)';
      ctx.font = '12px sans-serif';
      ctx.fillText('Neptena-OS Autonomous Video Engine', 80, 700);

      // Update UI Progress Bar
      const pct = (currentTime / totalDuration) * 100;
      progressFill.style.width = pct + '%';
      timeDisplay.textContent = formatTime(currentTime) + ' / ' + formatTime(totalDuration);
    }

    function loop(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      if (isPlaying) {
        currentTime += delta;
        if (currentTime >= totalDuration) {
          currentTime = totalDuration;
          isPlaying = false;
          playBtn.textContent = '▶ Play';
        }
      }

      renderFrame();

      if (isPlaying) {
        animationFrame = requestAnimationFrame(loop);
      }
    }

    playBtn.onclick = () => {
      initAudio();
      isPlaying = !isPlaying;
      if (isPlaying) {
        if (currentTime >= totalDuration) currentTime = 0;
        playBtn.textContent = '⏸ Pause';
        lastTimestamp = performance.now();
        animationFrame = requestAnimationFrame(loop);
        playTone(440, 'sine', 0.15);
      } else {
        playBtn.textContent = '▶ Play';
        cancelAnimationFrame(animationFrame);
      }
    };

    restartBtn.onclick = () => {
      currentTime = 0;
      renderFrame();
      playTone(520, 'sine', 0.1);
    };

    muteBtn.onclick = () => {
      soundEnabled = !soundEnabled;
      muteBtn.textContent = soundEnabled ? '🔊 Sound' : '🔇 Muted';
    };

    progressBar.onclick = (e) => {
      const rect = progressBar.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const pct = clickX / rect.width;
      currentTime = pct * totalDuration;
      renderFrame();
    };

    function seekToScene(index) {
      let t = 0;
      for (let i = 0; i < index; i++) t += scenes[i].duration;
      currentTime = t + 0.1;
      renderFrame();
      playTone(600, 'triangle', 0.1);
    }

    function formatTime(s) {
      const mins = Math.floor(s / 60);
      const secs = Math.floor(s % 60);
      return mins + ':' + (secs < 10 ? '0' : '') + secs;
    }

    function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      if (fill) ctx.fill();
      if (stroke) ctx.stroke();
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line, x, y);
          line = words[n] + ' ';
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, y);
    }

    // Export Video Recording (WebM)
    exportBtn.onclick = () => {
      initAudio();
      exportBtn.disabled = true;
      exportBtn.textContent = '🔴 Recording Video...';

      currentTime = 0;
      isPlaying = true;
      playBtn.textContent = '⏸ Pause';

      const stream = canvas.captureStream(30);
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'interactive-video-player-html-amp-production-script-autonomous-task-notification-webhook.webm';
        a.click();
        exportBtn.disabled = false;
        exportBtn.textContent = '✅ Downloaded WebM!';
        setTimeout(() => { exportBtn.textContent = '📹 Export WebM Video'; }, 3000);
      };

      mediaRecorder.start();
      lastTimestamp = performance.now();
      animationFrame = requestAnimationFrame(loop);

      const checkFinish = setInterval(() => {
        if (currentTime >= totalDuration) {
          clearInterval(checkFinish);
          mediaRecorder.stop();
          isPlaying = false;
          playBtn.textContent = '▶ Play';
        }
      }, 200);
    };

    // Initial render
    renderFrame();
  </script>
